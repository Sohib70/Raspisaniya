<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID va parolni yangilash</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .verify-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            width: 100%;
            max-width: 420px;
        }
        .form-control {
            border-radius: 8px;
            padding: 10px 15px;
        }
        .btn-action {
            background: #2c3e50;
            color: white;
            width: 100%;
            border-radius: 8px;
            padding: 10px;
            font-weight: 600;
        }
        .btn-action:hover {
            color: white;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="verify-card">
        <h4 class="fw-bold text-center mb-3 text-dark">Hisobni yangilash</h4>
        <p class="text-muted text-center small">Pochtangizga yuborilgan 5 xonali kodni kiriting, yangi ID raqam va yangi parol belgilang.</p>

        {% if messages %}
            {% for msg in messages %}
                <div class="alert alert-danger py-2 small">{{ msg }}</div>
            {% endfor %}
        {% endif %}

        <form action="{% url 'admin_password_verify_and_change' %}" method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label small fw-semibold">5 xonali tasdiqlash kodi</label>
                <input type="text" name="verification_code" class="form-control text-center fw-bold"
                       maxlength="5" placeholder="• • • • •" required autocomplete="off">
            </div>

            <div class="mb-3">
                <label class="form-label small fw-semibold">Yangi ID raqam (Login)</label>
                <input type="text" name="new_username" class="form-control" placeholder="Masalan: A-001" required>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-semibold">Yangi parol</label>
                <input type="password" name="new_password" class="form-control" placeholder="Kamida 4 ta belgi" required>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold">Yangi parolni takrorlang</label>
                <input type="password" name="confirm_password" class="form-control" placeholder="Qayta kiriting" required>
            </div>
            <button type="submit" class="btn btn-action">Ma'lumotlarni o'zgartirish</button>
        </form>
    </div>
</body>
</html>
